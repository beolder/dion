name: Release

# 打 tag（如 v1.0.0）时自动构建 Windows 与 macOS 安装包，并上传到 GitHub Releases。
# 也可在 Actions 页面手动触发（仅构建校验，不上传）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          # 国内网络环境下用镜像拉取 Electron 二进制，避免 GitHub 下载过慢导致超时
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
